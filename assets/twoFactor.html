<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Two-factor code</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 22px 24px 20px;
        font: 13px/1.45 -apple-system, system-ui, "Helvetica Neue", sans-serif;
        background: #1c1c1e;
        color: #f5f5f7;
        user-select: none;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 0 0 14px;
        color: #a1a1a6;
        font-size: 12.5px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #3a3a3c;
        background: #2c2c2e;
        color: #fff;
        font: 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 4px;
        text-align: center;
        outline: none;
      }
      input:focus {
        border-color: #0a84ff;
        box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 16px;
      }
      button {
        font: inherit;
        padding: 7px 16px;
        border-radius: 7px;
        border: none;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: #a1a1a6;
      }
      button.primary {
        background: #0a84ff;
        color: #fff;
        font-weight: 600;
      }
      button.primary:disabled {
        opacity: 0.45;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Apple sent a verification code</h1>
    <p id="hint">Enter the code shown on your Apple devices. This finishes the lossless sign-in.</p>
    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" autofocus />
    <div class="row">
      <button class="ghost" id="cancel">Cancel</button>
      <button class="primary" id="verify" disabled>Verify</button>
    </div>
    <script>
      const input = document.getElementById('code');
      const verify = document.getElementById('verify');
      const submit = () => {
        const code = input.value.replace(/\D/g, '');
        if (code.length < 6) return;
        window.lidraTwoFactor.submit(code);
      };
      input.addEventListener('input', () => {
        const digits = input.value.replace(/\D/g, '').slice(0, 6);
        input.value = digits;
        verify.disabled = digits.length < 6;
        if (digits.length === 6) submit();
      });
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') submit();
        if (event.key === 'Escape') window.lidraTwoFactor.cancel();
      });
      verify.addEventListener('click', submit);
      document.getElementById('cancel').addEventListener('click', () => window.lidraTwoFactor.cancel());
      input.focus();
    </script>
  </body>
</html>
