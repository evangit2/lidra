<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About</title>
<link rel="stylesheet" href="windowChrome.css">
<style>
body {
  color: #D9CDB2;
  -webkit-user-select: none;
  user-select: none;
}
.icon {
  margin-bottom: 20px;
}
.name {
  font-size: 22px;
  font-weight: 600;
  color: #F2EAD6;
  margin-bottom: 4px;
}
.version {
  font-size: 13px;
  color: #8FA393;
  margin-bottom: 16px;
}
.description {
  font-size: 13px;
  color: #A79C84;
  text-align: center;
  max-width: 320px;
  line-height: 1.5;
  margin-bottom: 20px;
}
.copyright {
  font-size: 11px;
  color: #71806F;
  margin-bottom: 4px;
}
.license {
  font-size: 11px;
  color: #71806F;
}
.close-btn {
  margin-top: 20px;
  padding: 6px 24px;
  font-size: 13px;
  font-family: inherit;
  color: #D9CDB2;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  cursor: pointer;
}
.close-btn:hover {
  background: rgba(255, 255, 255, 0.14);
}
</style>
</head>
<body>
<img class="icon" id="icon" src="lidra-mark.png" alt="Lidra">
<div class="name" id="name">Lidra</div>
<div class="version" id="version"></div>
<div class="description" id="description"></div>
<div class="copyright" id="copyright"></div>
<div class="license" id="license"></div>
<button class="close-btn" id="close-btn"></button>
<script>
  var params = new URLSearchParams(window.location.search);
  var lang = params.get('lang') || 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = /^(ar|he)(-|$)/i.test(lang) ? 'rtl' : 'ltr';
  var name = params.get('name') || 'Lidra';
  var version = params.get('version') || '';
  var description = params.get('description') || '';
  var author = params.get('author') || '';
  var license = params.get('license') || '';
  var aboutText = params.get('about') || 'About ' + name;
  var closeText = params.get('close') || 'Close';
  var versionPrefix = params.get('versionPrefix') || 'Version';
  var copyrightSuffix = params.get('copyrightSuffix') || 'All rights reserved.';
  var licensePrefix = params.get('licensePrefix') || 'Licensed under';
  var year = params.get('year') || String(new Date().getFullYear());

  document.title = aboutText;

  document.getElementById('name').textContent = name;
  document.getElementById('icon').alt = name;
  document.getElementById('version').textContent = versionPrefix + ' ' + version;
  document.getElementById('description').textContent = description;
  document.getElementById('copyright').textContent = '\u00A9 ' + year + ' ' + author + '. ' + copyrightSuffix;
  document.getElementById('license').textContent = licensePrefix + ' ' + license;
  document.getElementById('close-btn').textContent = closeText;
  document.querySelector('.close-btn').addEventListener('click', function() { window.close(); });
</script>
</body>
</html>
